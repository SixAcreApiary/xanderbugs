name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: package
        run: |
          zip=$(python3 scripts/package.py "$GITHUB_REF_NAME")
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Xanderbugs $GITHUB_REF_NAME" --generate-notes
